name: OpenUI Gateway acceptance
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'entrypoint.sh'
      - 'docs/openui-deployment-test.md'
      - 'nanobot/openui/**'
      - 'nanobot/cli/gateway_runtime.py'
      - 'nanobot/webui/**'
      - 'nanobot/channels/websocket/**'
      - 'webui/**'
      - 'packages/client-events/**'
      - 'tests/openui/**'
      - '.github/workflows/openui.yml'
  workflow_dispatch:
    inputs:
      refresh_manifest:
        description: Generate the component manifest on GitHub and upload it for review
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gateway-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install runtime and test dependencies
        run: uv pip install --system -e '.[dev]' websockets aiohttp
      - run: python -m pytest tests/openui -q
      - run: python -m scripts.check_import_boundaries
      - run: bun install --frozen-lockfile
        working-directory: webui
      - name: Generate requested OpenUI manifest
        if: inputs.refresh_manifest
        run: bun run openui:generate
        working-directory: webui
      - uses: actions/upload-artifact@v4
        if: inputs.refresh_manifest
        with:
          name: openui-generated-manifest
          path: nanobot/openui/generated/chat-library.json
      - run: bun run openui:check
        working-directory: webui
      - run: bun run typecheck
        working-directory: webui
      - name: Check changed OpenUI code
        run: |
          python -m ruff check nanobot/openui/forms.py nanobot/openui/actions.py tests/openui/test_forms.py nanobot/openui/generator.py nanobot/openui/policy.py nanobot/openui/collector.py nanobot/webui/openui_runtime.py nanobot/webui/inbound_commands.py tests/openui/test_gateway.py tests/openui/test_policy.py tests/openui/gateway_fixture.py tests/openui/container_gateway_probe.py tests/openui/packaged_gateway_smoke.py
          bun webui/node_modules/eslint/bin/eslint.js --config webui/eslint.config.js webui/src/openui/chat-library.tsx webui/src/openui/form-contract.ts webui/src/components/MessageBubble.tsx webui/src/openui/OpenUIChat.tsx webui/src/lib/nanobot-client.ts webui/src/lib/types.ts webui/src/components/thread/ThreadShell.tsx webui/src/tests/openui/OpenUIChat.test.tsx webui/src/tests/openui/form-contract.test.ts webui/src/tests/nanobot-client.test.ts webui/browser/openui-gateway-fixture.tsx webui/browser/openui-gateway.spec.ts --max-warnings 0
      - run: bun run check:imports
        working-directory: webui
      - run: bun x vitest run src/tests/openui src/tests/nanobot-client.test.ts src/tests/useNanobotStream.test.tsx src/tests/i18n.test.tsx src/tests/i18n-chat-resources.test.ts
        working-directory: webui
      - run: bun x playwright install --with-deps chromium
        working-directory: webui
      - name: Browser to native Gateway and tools
        working-directory: webui
        env:
          NANOBOT_OPENUI_GATEWAY_PYTHON: python
        run: bun run test:browser -- browser/openui.spec.ts browser/openui-gateway.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openui-browser-results-${{ github.sha }}
          path: webui/test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build installable test wheel
        run: |
          cd webui
          bun run build
          cd ..
          uv build --wheel --out-dir "$RUNNER_TEMP/openui-test-package"
          cd "$RUNNER_TEMP/openui-test-package"
          sha256sum ./*.whl > SHA256SUMS
      - name: Test the installed package with a real Gateway
        run: |
          uv pip install --target "$RUNNER_TEMP/openui-installed" --no-deps "$RUNNER_TEMP"/openui-test-package/*.whl
          python tests/openui/packaged_gateway_smoke.py "$RUNNER_TEMP/openui-installed"
      - uses: actions/upload-artifact@v4
        with:
          name: nanobot-openui-test-${{ github.sha }}
          path: ${{ runner.temp }}/openui-test-package/
          retention-days: 7
  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --build-arg NANOBOT_CHANNELS= -t nanobot-openui:test .
      - name: Start container and verify authenticated WebUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openui-container"
          cat > "$RUNNER_TEMP/openui-container/config.json" <<'JSON'
          {
            "agents": {"defaults": {"model": "openai/test-only", "provider": "openai", "dream": {"enabled": false}}},
            "providers": {"openai": {"apiKey": "test-only", "apiBase": "http://127.0.0.1:9/v1"}},
            "gateway": {"heartbeat": {"enabled": false}},
            "channels": {"websocket": {"enabled": true, "host": "0.0.0.0", "port": 8765,
              "tokenIssueSecret": "test-only-secret", "openuiEnabled": true, "openui": {"generation": "model"}}}
          }
          JSON
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs nanobot-openui-smoke || true; fi
            docker rm -f nanobot-openui-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run -d --name nanobot-openui-smoke -p 127.0.0.1:18765:8765 \
            -v "$RUNNER_TEMP/openui-container:/home/nanobot/.nanobot" nanobot-openui:test \
            gateway --foreground --config /home/nanobot/.nanobot/config.json
          for attempt in $(seq 1 60); do
            if curl -fs -H 'Authorization: Bearer test-only-secret' http://127.0.0.1:18765/webui/bootstrap >/dev/null; then break; fi
            sleep 1
          done
          curl -fs -H 'Authorization: Bearer test-only-secret' http://127.0.0.1:18765/webui/bootstrap >/dev/null
          docker exec -i --user 1000:1000 -e NANOBOT_TEST_WEB_SECRET=test-only-secret nanobot-openui-smoke \
            python - < tests/openui/container_gateway_probe.py
